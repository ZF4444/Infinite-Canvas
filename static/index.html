<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>AI Studio</title>
    <style>
        html.studio-route-booting body {
            visibility: hidden !important;
        }
    </style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/tailwindcss-cdn.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/vendor/js/marked-18.0.6.umd.js"></script>
    <script src="/static/vendor/js/dompurify-3.4.12.min.js"></script>
    <script src="/static/js/markdown-renderer.js"></script>
    <link rel="stylesheet" href="/static/css/markdown-content.css">
    <style>
        @import url('/static/vendor/css/fonts.css');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --monitor-bg: rgba(255, 255, 255, 0.7);
            --monitor-border: rgba(0, 0, 0, 0.05);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --monitor-bg: rgba(23, 29, 41, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.3);
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.5s var(--fluid-ease) 0.5s, background 0.3s, border-color 0.3s;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 220px;
            transition-delay: 0s;
        }

        /* 首次加载时与 iframe 的 0.5s 淡入同步播放，避免侧栏"焊死"在原地造成视觉断层 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--text);
            border-radius: 12px;
            background: transparent;
            padding: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            /* 仅保留 hover 真正会用到的属性过渡，避免 transition: all 因首屏属性补齐被意外触发 */
            transition: transform 0.6s var(--fluid-ease) 0.5s, border-radius 0.6s var(--fluid-ease) 0.5s, border-color 0.3s, background-color .18s, box-shadow .2s;
        }

        .sidebar:hover .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
            transition-delay: 0s;
        }

        .logo-ring:hover,
        .logo-ring:focus-visible {
            background: var(--nav-hover-bg);
            border-color: var(--text);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16), 0 10px 24px rgba(15, 23, 42, .08);
            outline: none;
        }

        .logo-ring:hover #logo-dot,
        .logo-ring:focus-visible #logo-dot {
            transform: scale(1.8);
        }

        .logo-ring:active {
            transform: scale(.94);
            transition-delay: 0s;
        }

        .sidebar:hover .logo-ring:active {
            transform: rotate(90deg) scale(.94);
        }

        #logo-dot {
            transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
        }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            /* 只对 width 做带延迟的过渡（侧栏悬停展开效果）；background/color 不参与过渡，避免 active 切换时底色"流动" */
            transition: width 0.3s var(--fluid-ease) 0.5s;
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        .sidebar:hover .nav-item {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s 0.5s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .nav-fold-toggle {
            position: relative;
            width: 48px;
            height: 36px;
            margin: 0 0 6px;
            padding-left: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            overflow: hidden;
            transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .sidebar:hover .nav-fold-toggle {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-fold-toggle:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .nav-fold-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            transition: transform 0.25s var(--fluid-ease);
        }

        .nav-fold-toggle[aria-expanded="false"] .nav-fold-icon {
            transform: rotate(-90deg);
        }

        .nav-fold-group {
            width: 100%;
            max-height: 282px;
            opacity: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
        }

        .nav-fold-group.is-collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar nav {
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 6px;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, .34) transparent;
        }

        .sidebar nav::-webkit-scrollbar { width: 4px; }
        .sidebar nav::-webkit-scrollbar-track { background: transparent; }
        .sidebar nav::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34);
            border-radius: 999px;
        }

        /* 主舞台区 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            transform: scale(1.02);
            filter: blur(4px);
            transition: all 0.5s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: scale(1);
            filter: blur(0);
            pointer-events: auto;
        }

        /* 作者组件 */

        .side-actions {
            margin-top:12px;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
            flex:0 0 auto;
        }

        .side-pill {
            width:44px;
            height:36px;
            border-radius:999px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 只过渡 hover/激活会改的属性，避免 all 触发延迟 */
            transition: width 0.3s var(--fluid-ease) 0.5s, gap 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow:hidden;
            gap:8px;
            position:relative;
        }

        .sidebar:hover .side-pill {
            width: 170px;
            transition-delay: 0s;
        }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .side-pill.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .side-pill.update-available {
            border-color:#22c55e;
            color:#16a34a;
            overflow:visible;
        }

        html.theme-dark .side-pill.update-available,
        body.theme-dark .side-pill.update-available {
            border-color:#86efac;
            color:#86efac;
        }

        .side-pill.update-available::after {
            content:"NEW";
            position:absolute;
            top:-7px;
            right:-9px;
            min-width:28px;
            height:16px;
            padding:0 5px;
            border-radius:999px;
            background:#22c55e;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#fff;
            font-size:9px;
            font-weight:900;
            letter-spacing:.02em;
            box-shadow:0 6px 16px rgba(34,197,94,.28), 0 0 0 3px rgba(34,197,94,.12);
            pointer-events:none;
        }

        html.theme-dark .side-pill.update-available::after,
        body.theme-dark .side-pill.update-available::after {
            background:#4ade80;
            color:#052e16;
            box-shadow:0 6px 16px rgba(74,222,128,.22), 0 0 0 3px rgba(74,222,128,.12);
        }

        .side-pill svg { width: 16px; height: 16px; flex:0 0 auto; }
        .side-pill-text {
            opacity:0;
            max-width:0;
            font-size:12px;
            font-weight:800;
            letter-spacing:.02em;
            white-space:nowrap;
            overflow:hidden;
            transition: opacity 0.3s 0.5s, max-width 0.3s var(--fluid-ease) 0.5s;
        }
        .sidebar:hover .side-pill-text {
            opacity:1;
            max-width:120px;
            transition-delay:.15s;
        }
        /* 折叠态去除 gap，避免图标被推偏 */
        .side-pill { gap:0; }
        .sidebar:hover .side-pill { gap:8px; }

        @media (max-height: 760px) {
            .sidebar { padding: 18px 0 14px; }
            .logo-ring { margin-bottom: 16px !important; }
            .nav-item {
                height: 42px;
                margin: 5px 0;
                border-radius: 15px;
            }
            .nav-fold-toggle {
                height: 32px;
                margin-bottom: 4px;
                border-radius: 14px;
            }
            .nav-fold-group { max-height: 282px; }
            .side-actions {
                margin-top:8px;
                margin-bottom:0;
                gap:5px;
                padding-top:8px;
                border-top:1px solid var(--border);
            }
            .side-pill {
                height:30px;
                width:40px;
            }
        }

        @media (max-height: 660px) {
            .sidebar { padding: 12px 0; }
            .logo-ring {
                width:32px;
                height:32px;
                border-radius:10px;
                margin-bottom:10px !important;
            }
            .nav-item {
                height:38px;
                margin:3px 0;
                border-radius:14px;
            }
            .nav-fold-toggle { height:30px; }
            .nav-fold-group { max-height: 252px; }
            .side-actions {
                gap:4px;
                padding-top:6px;
            }
            .side-pill {
                height:30px;
                width:38px;
            }
            .side-pill svg { width:15px; height:15px; }
        }

        .sidebar.is-pinned {
            width: 220px;
            transition-delay: 0s;
        }
        .sidebar.is-pinned .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
            transition-delay: 0s;
            background: var(--nav-hover-bg);
            color: var(--text);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .10);
        }
        .sidebar.is-pinned #logo-dot {
            background: var(--text) !important;
            transform: scale(1.35);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16);
        }
        .sidebar.is-pinned .logo-ring:hover,
        .sidebar.is-pinned .logo-ring:focus-visible {
            box-shadow: 0 0 0 5px rgba(148, 163, 184, .14);
        }
        .sidebar.is-pinned .nav-item,
        .sidebar.is-pinned .nav-fold-toggle {
            width: 190px;
            transition-delay: 0s;
        }
        .sidebar.is-pinned .nav-text {
            opacity: 1;
            transition-delay: 0.1s;
        }
        .sidebar.is-pinned .letter-d {
            transform: translateX(-120px);
            opacity: 0;
            transition-delay: 0s;
        }
        .sidebar.is-pinned .letter-x {
            transform: translateX(120px);
            opacity: 0;
            transition-delay: 0s;
        }
        .sidebar.is-pinned .author-content-wrap {
            opacity: 1;
            transform: scale(1);
            transition-delay: 0.2s;
            pointer-events: auto;
        }
        .sidebar.is-pinned .side-pill {
            width: 170px;
            gap: 8px;
            transition-delay: 0s;
        }
        .sidebar.is-pinned .side-pill-text {
            opacity: 1;
            max-width: 120px;
            transition-delay: .15s;
        }

        .sidebar.is-collapsing:hover {
            width: 80px;
        }
        .sidebar.is-collapsing:hover .logo-ring {
            transform: none;
            border-radius: 12px;
            background: transparent;
        }
        .sidebar.is-collapsing:hover .nav-item,
        .sidebar.is-collapsing:hover .nav-fold-toggle {
            width: 48px;
        }
        .sidebar.is-collapsing:hover .nav-text {
            opacity: 0;
        }
        .sidebar.is-collapsing:hover .letter-d {
            transform: translateX(-8px);
            opacity: 1;
        }
        .sidebar.is-collapsing:hover .letter-x {
            transform: translateX(8px);
            opacity: 1;
        }
        .sidebar.is-collapsing:hover .author-content-wrap {
            opacity: 0;
            transform: scale(0.9);
            pointer-events: none;
        }
        .sidebar.is-collapsing:hover .side-pill {
            width: 44px;
            gap: 0;
        }
        .sidebar.is-collapsing:hover .side-pill-text {
            opacity: 0;
            max-width: 0;
        }

        .floating-action {
            position: fixed;
            right: 0;
            transform: translateY(-50%);
            z-index: 120;
            width: 38px;
            min-height: 92px;
            border: 1px solid var(--border);
            border-right: 0;
            border-radius: 12px 0 0 12px;
            background: var(--sidebar-bg);
            color: var(--text);
            box-shadow: -8px 12px 30px rgba(15, 23, 42, .08);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            writing-mode: vertical-rl;
            letter-spacing: 0;
            font-size: 13px;
            font-weight: 700;
            transition: background-color .18s, transform .18s, box-shadow .18s;
        }
        .floating-action.feedback-float { top: calc(50% + 56px); }
        .floating-action.help-float { top: calc(50% - 56px); }
        .floating-action:hover,
        .floating-action:focus-visible {
            background: var(--nav-hover-bg);
            transform: translateY(-50%) translateX(-2px);
            outline: none;
            box-shadow: -10px 14px 36px rgba(15, 23, 42, .12);
        }
        .feedback-overlay {
            position: fixed;
            inset: 0;
            z-index: 130;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(15, 23, 42, .36);
        }
        .feedback-overlay.open { display: flex; }
        .feedback-modal {
            width: min(520px, 100%);
            background: var(--sidebar-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
            padding: 18px;
        }
        .feedback-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }
        .feedback-title { font-size: 16px; font-weight: 800; }
        .feedback-close {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
        }
        .feedback-close:hover { background: var(--nav-hover-bg); }
        .feedback-field { margin-bottom: 12px; }
        .feedback-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
            color: var(--muted);
        }
        .feedback-select,
        .feedback-textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: var(--stage-bg);
            color: var(--text);
            font: inherit;
            outline: none;
        }
        .feedback-select {
            height: 38px;
            padding: 0 10px;
        }
        .feedback-textarea {
            min-height: 150px;
            resize: vertical;
            padding: 11px 12px;
            line-height: 1.55;
        }
        .feedback-textarea:focus,
        .feedback-select:focus {
            border-color: var(--text);
            box-shadow: 0 0 0 3px rgba(148, 163, 184, .18);
        }
        .feedback-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
        }
        .feedback-status {
            min-height: 18px;
            color: var(--muted);
            font-size: 12px;
        }
        .feedback-status.ok { color: #16a34a; }
        .feedback-status.err { color: #dc2626; }
        .feedback-submit {
            height: 38px;
            border: 1px solid var(--text);
            border-radius: 9px;
            background: var(--text);
            color: var(--bg);
            padding: 0 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .feedback-submit:disabled { opacity: .55; cursor: not-allowed; }
        .help-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: min(var(--help-drawer-width, 480px), calc(100vw - 24px));
            height: 100vh;
            z-index: 125;
            background: var(--sidebar-bg);
            color: var(--text);
            border-left: 1px solid var(--border);
            box-shadow: -18px 0 50px rgba(15, 23, 42, .18);
            transform: translateX(100%);
            transition: transform .24s ease;
            display: flex;
            flex-direction: column;
            pointer-events: auto;
        }
        .help-drawer.open { transform: translateX(0); }
        .help-drawer.resizing { transition: none; }
        .help-resize-handle {
            position: absolute;
            top: 0;
            left: -5px;
            width: 10px;

        .help-body {

            overflow: auto;
            padding: 18px;
        }
        .help-editor {

        .help-markdown h3 { font-size: 15px; margin-top: 18px; }

</head>

    <script>
        /* Cache-proof fallback for touch expansion of the collapsible sidebar. */
        (() => {
            const bindTouchSidebar = () => {
                const sidebar = document.getElementById('studioSidebar');
                if (!sidebar || sidebar.dataset.touchExpandBound === '1') return;
                sidebar.dataset.touchExpandBound = '1';
                const expand = event => {
                    if (event.pointerType && event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
                    if (!sidebar.classList.contains('is-pinned')) sidebar.classList.add('is-touch-expanded');
                };
                const collapseOutside = event => {
                    if (event.pointerType && event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
                    if (!sidebar.contains(event.target) && !sidebar.classList.contains('is-pinned')) sidebar.classList.remove('is-touch-expanded');
                };
                sidebar.addEventListener('pointerdown', expand, {passive:true});
                sidebar.addEventListener('touchstart', expand, {passive:true});
                document.addEventListener('pointerdown', collapseOutside, {passive:true});
                document.addEventListener('touchstart', collapseOutside, {passive:true});
            };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindTouchSidebar, {once:true});
            else bindTouchSidebar();
        })();
    </script>
