<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>空间管理</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'dark';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/vendor/js/lucide.js"></script>
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/asset-manager.css">
    <link rel="stylesheet" href="/static/css/workspace-theme.css">
</head>
<body>
    <div class="asset-page">
        <header class="asset-page-head">
            <div>
                <div class="asset-title">空间管理</div>
                <div class="asset-sub">查看、筛选和管理账户文件与存储空间。</div>
            </div>
            <div class="asset-head-actions">
                <div id="assetStatus" class="asset-status">准备就绪</div>
                <button id="refreshBtn" class="asset-btn" type="button"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
            </div>
        </header>

        <main id="assetManagerRoot" class="asset-manager-root"></main>
    </div>

    <script src="/static/js/upload-quota-dialog.js"></script>
    <script src="/static/dist/asset-manager/storage-manager.js"></script>
    <script src="/static/dist/asset-manager/local-assets.js"></script>
    <script src="/static/dist/asset-manager/asset-library.js"></script>
    <script src="/static/dist/asset-manager/prompt-library.js"></script>
    <script src="/static/dist/asset-manager/avatar-registration.js"></script>
    <script src="/static/dist/asset-manager/detail-lightbox.js"></script>
    <script src="/static/dist/asset-manager/main.js"></script>
</body>
</html>
