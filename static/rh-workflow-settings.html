<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RH 应用配置</title><script src="/static/vendor/js/lucide.js"></script><script src="/static/js/theme.js"></script><link rel="stylesheet" href="/static/css/theme.css"><link rel="stylesheet" href="/static/css/api-settings.css"><style>body{padding:24px}.page{padding:0}.rh-shell{max-width:1100px;margin:auto}.rh-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.rh-head h1{margin:0;font-size:22px}.rh-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.rh-paste-row{display:flex;gap:8px}.rh-paste-input{flex:1}.rh-card-list{display:flex;flex-direction:column;gap:10px;margin-top:14px}.rh-config-card{background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:12px}.rh-card-columns{margin-top:18px}.rh-group-head{display:flex;justify-content:space-between;font-weight:800}.rh-workflow-editor-overlay{position:fixed!important;inset:0!important}</style></head><body>
<div class="rh-shell"><header class="rh-head"><div><h1>RH 应用</h1><p>管理 RunningHub 应用及其画布输入参数。</p></div><div id="status" class="status"></div></header>
<div id="runninghubConfigBlock" class="block runninghub-config-block"><div class="block-head"><div><div class="block-title">AI 应用</div><div class="block-desc">粘贴运行路径后创建应用。</div></div></div><div class="rh-paste-row"><input id="rhPasteInput" class="rh-paste-input" placeholder="/run/ai-app/..."><button class="action-btn" onclick="createRhEntryFromPaste()">+ 创建</button></div><div class="rh-card-columns"><div class="rh-group-head"><span>AI 应用</span><span id="rhAppsCount">0</span></div><div id="rhAppsList" class="rh-card-list"></div></div></div></div>
<div id="resourceList" hidden></div><main id="settingsContent" hidden><input id="nameInput"><input id="idInput"><input id="baseInput"><input id="protocolInput"><input id="keyInput"><span id="keyHint"></span><input id="rhFreeKeyInput"><span id="rhFreeKeyHint"></span><div id="connectionOnboardingCard"></div><div id="connectionBasicBlock"></div><div id="comfyBackendBlock"></div><div id="modelsHead"></div><div class="model-grid"></div><div id="modelConfigBlock"></div><div id="selectedModelIdField"></div><input id="selectedModelInput"><input id="selectedModelAliasInput"><input id="selectedModelProtocol"><div id="selectedModelProtocolField"></div><div id="selectedModelPriceFields"></div><input id="selectedModelInputPrice"><input id="selectedModelOutputPrice"><div id="imageModelList"></div><div id="chatModelList"></div><div id="videoModelList"></div></main>
<div id="rhWorkflowEditorOverlay" class="rh-workflow-editor-overlay"><div class="rh-workflow-editor-modal"><div class="rh-workflow-editor-head"><div><div id="rhWorkflowEditorTitle" class="rh-workflow-editor-title">RH 应用</div><div id="rhWorkflowEditorSub" class="rh-workflow-editor-sub"></div></div><div class="rh-workflow-editor-actions"><button class="action-btn" type="button" onclick="fetchRhAppEditor(true)"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i><span>重新拉取</span></button><button class="action-btn" type="button" onclick="exportRhWorkflowJson()"><i data-lucide="download" class="w-3.5 h-3.5"></i><span>导出 JSON</span></button><button class="action-btn" type="button" onclick="document.getElementById('rhWorkflowImportInput')?.click()"><i data-lucide="upload" class="w-3.5 h-3.5"></i><span>导入 JSON</span></button><input id="rhWorkflowImportInput" type="file" accept="application/json,.json" hidden onchange="importRhWorkflowJson(this.files?.[0]); this.value=''"/><button id="rhWorkflowSaveBtn" class="action-btn save-btn" onclick="saveRhWorkflowEditor()">保存</button><button class="rh-workflow-editor-close" onclick="closeRhWorkflowEditor()">×</button></div></div><div class="rh-workflow-editor-body"><aside class="rh-workflow-editor-side"><label class="rh-editor-field"><span>名称</span><input id="rhWorkflowEditName" oninput="updateRhWorkflowEditorMeta('title',this.value)"></label><label class="rh-editor-field"><span>备注</span><textarea id="rhWorkflowEditNote" oninput="updateRhWorkflowEditorMeta('description',this.value)"></textarea></label><div id="rhWorkflowEditorSummary" class="rh-editor-summary"></div><div id="rhWorkflowEditorNodeList" class="rh-editor-node-list"></div></aside><section class="rh-workflow-editor-canvas"><div id="rhWorkflowEditorGraphWrap" class="rh-editor-graph-wrap rh-app-field-wrap"></div></section></div></div></div>
<script src="/static/js/rh-workflow-settings.js"></script><script src="/static/dist/workflow-settings/rh-workflow-editor.js"></script></body></html>
